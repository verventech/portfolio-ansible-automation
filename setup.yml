---
- name: Setup Portfolio Automation using Ansible
  hosts: localhost
  become: yes
  vars:
    db_name: "portfolio_db"
    db_user: "musharaf"
    db_pass: "musharaf_secure_pass_123"

  tasks:
    - name: Install required packages
      ansible.builtin.apt:
        pkg:
          - apache2
          - postgresql
          - postgresql-contrib
          - php
          - libapache2-mod-php
          - php-pgsql
          - python3-psycopg2
          - acl
        state: present
        update_cache: yes

    # Note: If you are still running this inside WSL or Docker, 
    # replace this block with the shell workaround we discussed earlier.
    - name: Ensure apache2 and psql are running and enabled
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - apache2
        - postgresql

    - name: Create PSQL User
      become_user: postgres
      community.postgresql.postgresql_user:
        name: "{{ db_user }}"
        password: "{{ db_pass }}"
        state: present

    - name: Create a database
      become_user: postgres
      community.postgresql.postgresql_db:
        name: "{{ db_name }}"
        owner: "{{ db_user }}"
        state: present

    - name: Create education table using Ansible
      become_user: postgres
      community.postgresql.postgresql_query:
        db: "{{ db_name }}"
        query: |
          CREATE TABLE IF NOT EXISTS education (
            id SERIAL PRIMARY KEY,
            institution VARCHAR(255) NOT NULL,
            degree VARCHAR(255) NOT NULL,
            duration VARCHAR(100) NOT NULL
          );
          ALTER TABLE education OWNER TO "{{ db_user }}";
          ALTER SEQUENCE education_id_seq OWNER TO "{{ db_user }}";

    - name: Insert initial education data (Idempotent..)
      become_user: postgres
      community.postgresql.postgresql_query:
        db: "{{ db_name }}"
        query: |
          INSERT INTO education (institution, degree, duration)
          SELECT 'Your University Name', 'BSc Computer Science', '2018 - 2022'
          WHERE NOT EXISTS (
            SELECT 1 FROM education WHERE institution = 'Your University Name'
          );

    - name: Set Apache env vars
      ansible.builtin.blockinfile:
        path: /etc/apache2/envvars
        marker: "# {mark} ANSIBLE MANAGED PORTFOLIO ENV VARS"
        block: |
          export PGHOST="localhost"
          export PGDATABASE="{{ db_name }}"
          export PGUSER="{{ db_user }}"
          export PGPASSWORD="{{ db_pass }}"
          export PGPORT="5432"
      notify: Restart Apache
    
    - name: Remove old index.html
      ansible.builtin.file:
        path: /var/www/html/index.html
        state: absent

    - name: Copy new index.php
      ansible.builtin.copy:
        src: files/index.php
        dest: /var/www/html/index.php
        owner: www-data
        group: www-data
        mode: '0755'
      notify: Restart Apache

  handlers:
    - name: Restart Apache
      ansible.builtin.service:
        name: apache2
        state: restarted